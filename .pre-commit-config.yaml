# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Fix trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Ensure files end with newline
      - id: end-of-file-fixer
      # Check YAML syntax
      - id: check-yaml
        args: [--unsafe] # Allow custom YAML tags for MkDocs
      # Check JSON syntax
      - id: check-json
      # Check for merge conflicts
      - id: check-merge-conflict
      # Check for large files
      - id: check-added-large-files
        args: [--maxkb=1000]
      # Fix mixed line endings
      - id: mixed-line-ending
        args: [--fix=lf]

  # EditorConfig checker
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 2.7.3
    hooks:
      - id: editorconfig-checker
        alias: ec
        exclude: ^(uv\.lock|\.secrets\.baseline|agents/.*|docs/reference/.*|docs/tips-and-tricks\.md)$

  # YAML linting with yamlint
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  # Markdown linting with markdownlint-cli2
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        args: [--config, .markdownlint-cli2.jsonc]

  # Python code formatting with black
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black]

  # Python linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Check for secrets/credentials
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package.lock.json

  # Prettier formatting using npx (local hook)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'npx --yes prettier@3.3.3 --write --ignore-unknown "$@"' --
        language: system
        types_or: [json, yaml, markdown]
        exclude: ^(uv\.lock|\.markdownlint-cli2\.jsonc|agents/)$

# Global settings
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false
