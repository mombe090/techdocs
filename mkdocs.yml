              - Integrate Systems: how-to/event-streaming/kafka/kafka-connect-systems.md
              - Process Data Streams: how-to/event-streaming/kafka/kafka-stream-processing.md
              - Use Schema Registry: how-to/event-streaming/kafka/kafka-use-schema-registry.md

  - Explanation:
