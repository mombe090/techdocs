# Project information
site_name: Mombe Docs
site_url: https://docs.mombesoft.com
site_author: Yaya DIALLO
site_description: >-
  Personal documentation and tips and ticks about various tech topics i learn
  From home labs to the cloud, all best practices and how-tos.

# Repository (optional - update with your repo if you have one)
repo_name: mombe090/techdocs
repo_url: https://github.com/mombe090/techdocs

# Copyright
copyright: Copyright &copy; 2025 free to copy and share, by Mombe090.

# Configuration
theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    # Palette toggle for light mode (Catppuccin Latte Blue via CSS)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    # Palette toggle for dark mode (Catppuccin Mocha Crust via CSS)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/library

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Tutorials: Tutoriels
            Apache Kafka: Apache Kafka
            Kafka Getting Started: Démarrer avec Kafka
            How-to Guides: Guides Pratiques
            Produce Messages to Kafka: Produire des Messages vers Kafka
            Consume Messages from Kafka: Consommer des Messages depuis Kafka
            Integrate External Systems: Intégrer des Systèmes Externes
            Use Schema Registry: Utiliser Schema Registry
            Process Data Streams: Traiter des Flux de Données
            Explanation: Explications
            Tips & Tricks: Astuces & Conseils
  - minify:
      minify_html: true

# Custom CSS
extra_css:
  - stylesheets/extra.css

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree - Organized using Diátaxis framework
nav:
  - Home: index.md
  - Tutorials:
      - Apache Kafka:
          - Kafka Getting Started: tutorials/kafka-getting-started.md
  - How-to Guides:
      - Apache Kafka:
          - Produce Messages to Kafka: how-to/kafka-produce-messages.md
          - Consume Messages from Kafka: how-to/kafka-consume-messages.md
          - Integrate External Systems: how-to/kafka-connect-systems.md
          - Process Data Streams: how-to/kafka-stream-processing.md
          - Use Schema Registry: how-to/kafka-use-schema-registry.md
  - Explanation:
      - wip: wip.md
  - Tips & Tricks: tips-and-tricks.md
