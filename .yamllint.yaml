---
# Yamlint configuration for MkDocs projects
# See https://yamllint.readthedocs.io/en/stable/rules.html

extends: default

# Ignore patterns
ignore: |
  site/
  .venv/
  venv/
  node_modules/

rules:
  # Allow longer lines (documentation often has long URLs)
  line-length:
    max: 120
    level: warning

  # Allow inline mappings (useful for MkDocs config)
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Allow inline sequences
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Document start (---) is optional
  document-start:
    present: false

  # Indentation: 2 spaces
  indentation:
    spaces: 2
    indent-sequences: true

  # Allow duplicate keys (MkDocs uses Python tags that may appear similar)
  key-duplicates:
    level: warning

  # Allow truthy values (yes/no, on/off, etc.)
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false

  # Comments indentation
  comments:
    min-spaces-from-content: 1

  # Empty lines
  empty-lines:
    max: 2
    max-start: 0
    max-end: 0

  # Trailing spaces
  trailing-spaces: enable

  # Key ordering not enforced (allows flexible organization)
  key-ordering: disable
